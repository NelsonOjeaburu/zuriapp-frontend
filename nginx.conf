server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # try_files falls back to index.html for any path that isn't a real file.
    # Needed because this is a single-page app: React handles routing in the
    # browser, so nginx must hand back index.html for any path and let React
    # figure out what to render, instead of 404-ing on e.g. /products/3.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lightweight endpoint for Kubernetes liveness/readiness probes (Day 4)
    # and for your daily health-check script if you want to check the
    # frontend as well as the backend.
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
